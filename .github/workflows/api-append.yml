name: 每 30 分鐘把 API 的即時值併進歷史檔

# 為什麼需要這個：
#   history 站的日檔要等隔天台灣時間 03:00 才產出，而 API 只保留約 2 小時。
#   中間會有最多約 22 小時的缺口——「今天」幾乎整天看不到資料。
#   每 2 小時把 API 那個滾動視窗撈下來併進 CSV，缺口就縮到最多 2 小時。
#
# 順帶好處：資料開始自己累積，不再完全依賴 history 站
#   （民生公共物聯網的資料服務據稱只提供到 2026-12-01）。
#
# 間隔為什麼是 1 小時（原本是 2 小時）：API 實測只保留約 2 小時，所以任何一次
#   「該跑而沒跑」超過 2 小時，中間的觀測值就永久取不回來。而 **GitHub 的 schedule
#   是盡力而為、不保證準時，也不保證會觸發**：2026-08-26～28 實測，設定每 2 小時
#   （一天應有 12 次）的這個 workflow 只產生了 3 次執行，間隔 9～11 小時，
#   缺掉的時段就是使用者在圖上看到的破碎區塊。
#   排程本身沒辦法變可靠，只能提高嘗試次數：改成每小時，讓落在任一個 2 小時
#   視窗內的機會加倍。每次執行約 13 秒、對來源只發一個小請求，成本可忽略。
# **2026-09-04 起，這個 workflow 是唯一的資料來源。** 以對照探測確認：
#   20260831 三個測項都回 183 MB 的 ZIP，20260901/02/03 的 11 個候選代碼全部回
#   text/html——**站方在 2026-08-31 之後不再產出日檔**。hist-daily 那層保險沒有了，
#   漏跑一次就是永久少一段（API 只留 2 小時，沒有第二條路可以補）。
# 所以間隔再縮短到 30 分鐘：GitHub 的 schedule 實測會漏跑，唯一能做的就是提高
# 嘗試次數。每次執行約 13 秒、對來源只發一個小請求，成本可忽略。

on:
  schedule:
    - cron: "5,35 * * * *"       # 錯開整點，避開 GitHub 排程的尖峰
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICES: "13580653094"

# 同時只跑一個，避免兩次執行同時 commit 而互相打架
concurrency:
  group: api-append
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 測項不在這裡寫死：沿用 manifest 裡已經在追蹤的那些，
      # 這樣日後回填新測項時不用兩邊都改。
      - name: 抓 API 並併進 CSV
        id: fetch
        continue-on-error: true      # 政府來源偶爾連不上，不必讓整個排程變紅
        run: |
          set -euo pipefail
          python3 scripts/hist_extract.py --api-append --devices "$DEVICES" --out data

      - name: 有變動才 commit
        run: |
          set -euo pipefail
          # 用 git status 而不是 git diff：未追蹤的檔案 git diff 看不到
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "data/ 沒有變動，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "API 即時值：$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') (台灣時間)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
