name: 每日增量抓取 history 資料

# history 站約在台灣時間 03:00 產出前一日的檔案，這裡排在台灣時間 05:00（UTC 21:00）。
# 想改抓哪些裝置／測項，直接改下面的 env。

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICES: "13580653094"
  TZ_SOURCE: "taipei"          # 由 dry-run 對照 API 確認後填入，不可用猜的

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 存 API 快照（供時區驗證，且過了就再也拿不到）
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/hist_extract.py --api-snapshot --devices "$DEVICES" \
            --label "Relative humidity" --out data

      - name: 抓最近四天（各測項，已完整的日子會自動跳過）
        run: |
          set -euo pipefail
          # runner 是 UTC，這裡要的是「台灣時間」的日期，所以先 +8 小時再算。
          #
          # 為什麼是四天而不是一天：
          #   (a) 站方約在台灣時間 03:00 才放上前一日的檔案，延遲就會整天漏掉；
          #   (b) **GitHub 的 schedule 不保證會觸發**。2026-08-27 21:00Z 這一次
          #       整個沒有產生執行紀錄，08-27 的日檔因此從來沒被抓過，那一天在
          #       CSV 裡只剩 api-append 補的 314 列（正常是 1440 列）。
          #       視窗只有兩天時，連漏一次就永久少一天。
          # 拉寬視窗不等於多下載：--skip-complete 會先看 CSV，該台灣日的該測項
          # 已經有足夠列數就直接跳過，不下載。穩定狀態下每天其實只下載
          # 「昨天」一個檔，比原本固定抓兩天還少。
          #
          # 門檻取 1200：一天滿載是 1440 列（每分鐘一筆）。實測 08-08～08-26 的
          # 完整日落在 1333～1440（感測器自己會掉幾分鐘），而來源本身就殘缺的日子
          # 是 1092（08-11）、780（08-13）、0（08-12）。1200 剛好把兩群分開——
          # 完整日跳過，殘缺日仍會再試一次（站方可能事後補齊）。
          FROM=$(date -u -d "+8 hours -4 days" +%Y%m%d)
          TO=$(date -u -d "+8 hours -1 day" +%Y%m%d)
          echo "處理台灣時間 $FROM ～ $TO"
          # param=檔名代碼；label=網頁上的測項名稱，兩者必須對得起來
          run_one () {
            python3 scripts/hist_extract.py --date "$FROM" --until "$TO" \
              --param "$1" --label "$2" --skip-missing --skip-complete 1200 \
              --devices "$DEVICES" --tz "$TZ_SOURCE" --out data
          }
          # 2026-08-22 以 --probe 實測：只有 humidity、pm25、temperature 三個代碼存在
          # （pm2.5、pm2_5、PM25、pm10、temp、voc、co2 都是 HTTP 200 但回 HTML 錯誤頁）。
          # 這三個正好對應該裝置的三個 datastream。temperature 目前沒用到就不抓，
          # 每個測項每天都是一次 ~220 MB 的下載。
          run_one pm25 "PM2.5"
          run_one humidity "Relative humidity"

      # 來源的時間欄位沒有時區標記，猜錯整條歷史會偏 8 小時。
      # 昨天存的 API 快照（phenomenonTime 明確是 UTC）今天才有對應的 history 檔可比，
      # 所以判定只能隔天做。判定成功會寫下 CONFIRMED，之後這一步就自動跳過。
      - name: 時區判定（尚未確認時才跑）
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f data/_tzcheck/CONFIRMED ]; then
            echo "時區已確認（$(head -1 data/_tzcheck/CONFIRMED)），跳過"
            exit 0
          fi
          if ! ls data/_tzcheck/*.json >/dev/null 2>&1; then
            echo "還沒有 API 快照可比對，跳過"
            exit 0
          fi
          python3 scripts/hist_extract.py --tz-check --devices "$DEVICES" \
            --param humidity --label "Relative humidity" --skip-missing --out data

      - name: 有變動才 commit
        run: |
          set -euo pipefail
          # 用 git status 而不是 git diff：data/ 第一次產生時是「未追蹤」檔案，
          # git diff 看不到未追蹤檔案，會誤判成沒有變動而把抓到的資料丟掉。
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "data/ 沒有變動，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "每日增量：$(date -u -d yesterday +%Y-%m-%d)"
          # 併發或落後時先 rebase 再推，避免非快轉被拒。
          # 要 rebase 到「這個 workflow 正在跑的分支」，寫死 main 會在功能分支上撞成衝突。
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
