name: 回填 history 歷史資料（手動）

# 為什麼要有這個：微型感測器的 API 只留約 2 小時，跨日資料只在 history.colife.org.tw
# 的每日 ZIP 裡，而那些檔案每天每測項約 176 MB 且不允許跨來源存取，瀏覽器做不到。
# 在這裡下載、解壓、篩出指定裝置，輸出成小檔 commit 進 repo，網頁再以同源方式讀取。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "要做什麼"
        required: true
        default: "時區判定"
        type: choice
        options:
          - "探勘 ZIP 結構（dry-run）"
          - "探測有哪些測項代碼"
          - "存 API 快照（時區用）"
          - "時區判定"
          - "正式萃取"
      start:
        description: "起始日 YYYYMMDD（存 API 快照時可留空）"
        required: false
      until:
        description: "結束日 YYYYMMDD（含當天；留空＝只做起始日）"
        required: false
      param:
        description: "檔名裡的測項代碼，例如 humidity、pm25"
        required: true
        default: "humidity"
      label:
        description: "輸出欄位名稱（要與網頁的測項名一致，例如 PM2.5、Relative humidity）"
        required: true
        default: "Relative humidity"
      devices:
        description: "裝置編號，逗號分隔"
        required: true
        default: "13580653094"
      tz:
        description: "來源時間欄位的時區（只在「正式萃取」用到，要先由「時區判定」確認）"
        required: true
        default: "taipei"
        type: choice
        options: ["taipei", "utc"]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 執行
        env:
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
          UNTIL: ${{ inputs.until }}
          PARAM: ${{ inputs.param }}
          LABEL: ${{ inputs.label }}
          DEVICES: ${{ inputs.devices }}
          TZ_SOURCE: ${{ inputs.tz }}
        run: |
          set -euo pipefail
          COMMON=(--param "$PARAM" --label "$LABEL" --out data)
          case "$MODE" in
            "存 API 快照（時區用）")
              python3 scripts/hist_extract.py --api-snapshot --devices "$DEVICES" "${COMMON[@]}"
              exit 0 ;;
          esac
          [ -n "$START" ] || { echo "::error::這個模式需要填「起始日」"; exit 1; }
          ARGS=(--date "$START" "${COMMON[@]}")
          if [ -n "$UNTIL" ]; then ARGS+=(--until "$UNTIL"); fi
          case "$MODE" in
            "探勘 ZIP 結構（dry-run）") ARGS+=(--dry-run) ;;
            "探測有哪些測項代碼")       ARGS+=(--probe) ;;
            "時區判定")                 ARGS+=(--tz-check --devices "$DEVICES") ;;
            "正式萃取")                 ARGS+=(--devices "$DEVICES" --tz "$TZ_SOURCE") ;;
            *) echo "::error::未知的模式：$MODE"; exit 1 ;;
          esac
          python3 scripts/hist_extract.py "${ARGS[@]}"

      - name: 有變動才 commit
        if: ${{ inputs.mode == '正式萃取' || inputs.mode == '存 API 快照（時區用）' }}
        run: |
          set -euo pipefail
          # 用 git status 而不是 git diff：data/ 第一次產生時是「未追蹤」檔案，
          # git diff 看不到未追蹤檔案，會誤判成沒有變動而把抓到的資料丟掉。
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "data/ 沒有變動，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "回填 history 資料：${{ inputs.start }}~${{ inputs.until || inputs.start }} ${{ inputs.label }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
